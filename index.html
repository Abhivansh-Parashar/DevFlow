<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link

      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B1E24'/%3E%3Cpath d='M7 16h6l3-7 3 14 3-7h4' stroke='%2300C2A8' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%2300C2A8'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevFlow — a developer productivity platform. Workspaces, projects, and issues with a pipeline." />
    <title>DevFlow — Every issue has a path</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply theme before first paint. Default is dark; legacy light → dark.
      (function () {
        try {
          var raw = localStorage.getItem('devflow-store');
          var theme = 'dark';
          if (raw) {
            try {
              theme = (JSON.parse(raw).state && JSON.parse(raw).state.theme) || 'dark';
            } catch (e) {}
          }
          if (theme === 'light') theme = 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          else if (theme === 'brutal') document.documentElement.classList.add('brutal');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
